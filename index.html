<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZapPulse ⚡ - Le Prime Time Réinventé</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { extend: { colors: { darkBase: '#0f172a', brand: '#3b82f6' } } } 
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .progress-bar { transition: width 1s linear; }
        .hide { display: none !important; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 pb-32">
    <!-- Header -->
    <header class="max-w-4xl mx-auto flex justify-between items-center mb-8">
        <div>
            <h1 class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">ZapPulse ⚡</h1>
            <p class="text-slate-400 text-sm mt-1">Le radar à pépites TV</p>
        </div>
        <div class="glass-card px-4 py-2 rounded-2xl flex items-center gap-3">
            <span id="meteo-icon" class="text-2xl">⏳</span>
            <div>
                <p class="text-sm font-bold">Météo du Prime</p>
                <p id="meteo-text" class="text-xs text-slate-300">Analyse en cours...</p>
            </div>
        </div>
    </header>

    <!-- Filtres -->
    <div class="max-w-4xl mx-auto flex gap-3 mb-8 overflow-x-auto pb-2 scrollbar-hide">
        <button class="filter-btn active bg-blue-600 px-4 py-2 rounded-full text-sm font-bold shadow-lg" data-filter="all">Tout voir</button>
        <button class="filter-btn bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-full text-sm font-bold transition-colors" data-filter="Cinéma">🍿 Cinéma</button>
        <button class="filter-btn bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-full text-sm font-bold transition-colors" data-filter="Sport">⚽ Sport</button>
        <button class="filter-btn bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-full text-sm font-bold transition-colors" data-filter="Documentaire">🧠 Documentaire</button>
    </div>

    <!-- Timeline des programmes -->
    <main class="max-w-4xl mx-auto space-y-6" id="tv-timeline">
        <p class="text-center text-slate-500 animate-pulse">Synchronisation avec Supabase...</p>
    </main>

    <!-- La Roulette du Zapping -->
    <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 flex flex-col items-center gap-2 z-50">
        <div id="roulette-result" class="hide glass-card px-6 py-3 rounded-2xl text-center text-sm font-bold text-yellow-300 mb-2 shadow-2xl border-yellow-500/30">
            <!-- Résultat de la roulette -->
        </div>
        <button id="btn-roulette" class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 px-8 py-4 rounded-full font-bold text-lg shadow-lg shadow-purple-500/40 transition-transform transform hover:scale-105 hover:rotate-1 flex items-center gap-2 border border-white/20">
            🎲 Roulette du Zapping
        </button>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
