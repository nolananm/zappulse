<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZapPulse ⚡ - Le Prime Time Réinventé</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkBase: '#0f172a' } } } }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .progress-bar-animated { transition: width 1s linear; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <header class="max-w-4xl mx-auto flex justify-between items-center mb-10">
        <div>
            <h1 class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">ZapPulse ⚡</h1>
            <p class="text-slate-400 text-sm mt-1">Le radar à pépites TV</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto space-y-6" id="tv-timeline">
        <!-- Les programmes TV s'afficheront ici via app.js -->
        <p class="text-center text-slate-500">Chargement des programmes depuis Supabase...</p>
    </main>

    <!-- Import du JS en tant que module -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
